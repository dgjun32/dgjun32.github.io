<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ site.data.main_info.name }}</title>
  <meta name="description" content="Homepage of {{ site.data.main_info.name }}">
  <meta name="author" content="{{ site.data.main_info.name }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ '/libs/custom/my_css.css' | prepend: site.baseurl }}">
</head>

<body>
  <div class="page">

    {{ content }}

    <div class="site-footer">
      <a href="https://web.media.mit.edu/~msaveski/" target="_blank" rel="noopener">template credit</a>
    </div>
  </div>

  <script>
    // Publication tabs
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;
      var group = btn.closest('.tab-group');
      group.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      group.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      group.querySelector(btn.dataset.target).classList.add('active');
    });
  </script>

  {% include google_analytics.html %}
</body>
</html>
